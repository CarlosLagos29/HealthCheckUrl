server:
  port: 9090

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-14replace(%thread){'^.*-exec-', 'exec-'}){faint} %clr(%-22logger{0}){cyan} : %m%n%wEx"
  level:
    root: WARN
    dev.healthcheck: INFO
    org.springframework.boot.tomcat.TomcatWebServer: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /docs
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha

healthcheck:
  timeouts:
    connect: 2s
    read: 2s
    total: 10s
  max-redirects: 5
  allowed-ports: [80, 443]
  batch:
    max-urls: 5
    concurrency: 5
    timeout: 15s
  rate-limit:
    per-ip:
      capacity: 10
      period: 1m
    global:
      capacity: 20
      period: 10m
    per-host:
      capacity: 3
      period: 10m
